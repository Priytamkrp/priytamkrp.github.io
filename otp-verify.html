<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Telegram OTP Verification | Designed by Priytam</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #101522;
            --border-color: #1e293b;
            --accent-cyan: #00e5ff;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow-cyan: rgba(0, 229, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.25s ease; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }

        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 1.5rem; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tag { font-family: 'Rajdhani', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; color: var(--accent-cyan); background: rgba(0, 229, 255, 0.1); padding: 0.3rem 0.8rem; border-radius: 20px; text-transform: uppercase; border: 1px solid rgba(0, 229, 255, 0.3); display: inline-block; margin-bottom: 0.8rem; }
        
        h1 { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; text-transform: uppercase; color: #fff; margin-bottom: 0.3rem; }
        h1 span { color: var(--accent-cyan); text-shadow: 0 0 15px var(--glow-cyan); }
        .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.5rem; }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.2rem; text-align: left; }
        label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        input { width: 100%; padding: 0.9rem 1rem; background: #07090e; border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 1rem; outline: none; font-family: 'Share Tech Mono', monospace; text-align: center; letter-spacing: 2px; }
        input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }

        .btn-action { width: 100%; padding: 0.9rem; background: var(--accent-cyan); color: #07090e; border: none; border-radius: 10px; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; box-shadow: 0 4px 15px var(--glow-cyan); margin-top: 0.5rem; }
        .btn-action:hover { opacity: 0.9; transform: translateY(-2px); }

        .otp-section { display: none; }
        .success-box { background: rgba(34, 197, 94, 0.1); border: 1px solid var(--accent-green); border-radius: 12px; padding: 1.5rem; color: var(--accent-green); font-weight: 600; display: none; margin-top: 1rem; }

        .footer-links { text-align: center; margin-top: 0.5rem; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .back-link:hover { color: var(--accent-cyan); }
        .branding { text-align: center; font-size: 0.75rem; color: #4b5563; margin-top: 0.5rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <span class="tag">🔒 Secure Gateway</span>
            <h1>Telegram <span>OTP Auth</span></h1>
            <p class="subtitle">Enter your mobile number to receive live Telegram OTP verification.</p>

            <!-- Step 1: Phone Input -->
            <div id="phoneStep">
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="userPhone" placeholder="Enter 10-digit number" maxlength="10">
                </div>
                <button class="btn-action" onclick="sendOtpToTelegram()">Send OTP 📨</button>
            </div>

            <!-- Step 2: OTP Verification -->
            <div id="otpStep" class="otp-section">
                <div class="form-group">
                    <label>Enter 4-Digit OTP (Check Telegram)</label>
                    <input type="text" id="enteredOtp" placeholder="----" maxlength="4">
                </div>
                <button class="btn-action" onclick="verifyOtp()">Verify OTP ⚡</button>
            </div>

            <!-- Success Box -->
            <div class="success-box" id="successBox">
                🎉 Authentication Successful! Access Granted to Portal.
            </div>
        </div>

        <div class="footer-links">
            <a href="index.html" class="back-link">← Return to Portfolio Directory</a>
            <div class="branding">Designed by Priytam Kumar</div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "9118414145:AAHsgvCjd0FXoP6cLmcWHSDUKIMV7sir7M";[span_0](start_span)[span_0](end_span)
        const CHAT_ID = "5828866598";[span_1](start_span)[span_1](end_span)

        let generatedOtp = "";
        let targetPhone = "";

        function sendOtpToTelegram() {
            targetPhone = document.getElementById('userPhone').value.trim();

            if (!targetPhone || targetPhone.length < 10) {
                alert("Please enter a valid 10-digit mobile number!");
                return;
            }

            // Generate random 4 digit OTP
            generatedOtp = Math.floor(1000 + Math.random() * 9000);

            const message = `🚨 NEW OTP REQUEST 🚨\n\n📱 Phone: +91 ${targetPhone}\n🔑 OTP Code: ${generatedOtp}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`;

            // Using Image beacon method to bypass CORS restrictions completely
            const img = new Image();
            img.src = url;

            alert("📨 OTP request triggered! Check your Telegram bot.");
            document.getElementById('phoneStep').style.display = 'none';
            document.getElementById('otpStep').style.display = 'block';
        }

        function verifyOtp() {
            const userEntered = document.getElementById('enteredOtp').value.trim();

            if (userEntered === String(generatedOtp)) {
                document.getElementById('otpStep').style.display = 'none';
                document.getElementById('successBox').style.display = 'block';
            } else {
                alert("❌ Incorrect OTP! Please check the code sent to your Telegram.");
            }
        }
    </script>
</body>
</html>
