<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Catalog | Priytam.dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --accent-cyan: #00e5ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-cyan: rgba(0, 229, 255, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; display: flex; flex-direction: column; justify-content: space-between; }
        .container { max-width: 900px; margin: 0 auto; width: 100%; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-family: 'Rajdhani', sans-serif; font-size: 2.3rem; color: #fff; margin-bottom: 0.3rem; }
        header h1 span { color: var(--accent-cyan); }
        header p { color: var(--text-muted); font-size: 0.9rem; }
        
        .filter-bar { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .input-field { flex: 1; padding: 0.8rem 1rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        .input-field:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px var(--glow-cyan); }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.2rem; backdrop-filter: blur(10px); display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 0.3rem; }
        .product-price { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; color: var(--accent-cyan); font-weight: 700; margin-bottom: 1rem; }
        .btn-buy { width: 100%; padding: 0.6rem; background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-buy:hover { background: var(--accent-cyan); color: #000; }
        
        .back-link { display: block; text-align: center; margin-top: 2rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: var(--accent-cyan); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CyberStore <span>Product Catalog</span></h1>
            <p>Explore tech gadgets and accessories with live search filtering</p>
        </header>

        <div class="filter-bar">
            <input type="text" id="searchInput" class="input-field" placeholder="Search products..." oninput="filterProducts()">
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products loaded dynamically -->
        </div>

        <a href="index.html" class="back-link">← Return to Main Portfolio</a>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Motorola Edge 60 Fusion', price: '₹29,999', category: 'Smartphone' },
            { id: 2, name: 'Yakuza Russ Electric Scooter', price: '₹65,000', category: 'EV' },
            { id: 3, name: 'Mechanical RGB Keyboard', price: '₹3,499', category: 'Accessory' },
            { id: 4, name: 'Walkmora Oxford Formal Shoes', price: '₹2,199', category: 'Footwear' },
            { id: 5, name: 'Cyberpunk Gaming Headset', price: '₹4,299', category: 'Accessory' },
            { id: 6, name: 'Ergonomic Desk Chair', price: '₹7,999', category: 'Furniture' }
        ];

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(items.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">No products found.</p>';
                return;
            }
            items.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">${p.category}</span>
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price}</div>
                        </div>
                        <button class="btn-buy" onclick="alert('Added ${p.name} to cart!')">🛒 Add to Cart</button>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        renderProducts(products);
    </script>
</body>
</html>
