<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart College Notes Hub | Priytam.dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --accent-cyan: #00e5ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-cyan: rgba(0, 229, 255, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; display: flex; flex-direction: column; justify-content: space-between; }
        .container { max-width: 800px; margin: 0 auto; width: 100%; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-family: 'Rajdhani', sans-serif; font-size: 2.3rem; color: #fff; margin-bottom: 0.3rem; }
        header h1 span { color: var(--accent-cyan); }
        header p { color: var(--text-muted); font-size: 0.9rem; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.5rem; backdrop-filter: blur(10px); margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .input-field { width: 100%; padding: 0.8rem 1rem; background: #07090e; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 0.95nyrem; outline: none; }
        .input-field:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px var(--glow-cyan); }
        
        .btn { width: 100%; padding: 0.8rem; background: var(--accent-cyan); color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; box-shadow: 0 0 15px var(--glow-cyan); }
        .btn:hover { opacity: 0.9; }

        .notes-list { display: grid; gap: 1rem; margin-top: 1.5rem; }
        .note-item { background: #07090e; border: 1px solid var(--border-color); padding: 1rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .note-title { font-weight: 600; color: #fff; font-size: 1.05rem; }
        .note-sub { font-size: 0.8rem; color: var(--text-muted); }
        .download-btn { background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 0.4rem 0.8rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .download-btn:hover { background: var(--accent-cyan); color: #000; }
        .back-link { display: block; text-align: center; margin-top: 2rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: var(--accent-cyan); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart College Notes <span>Hub</span></h1>
            <p>Access and upload semester notes, syllabus, and study materials</p>
        </header>

        <div class="card">
            <h3 style="margin-bottom: 1rem; font-family: 'Rajdhani', sans-serif; font-size: 1.3rem;">Upload New Study Material</h3>
            <div class="input-group">
                <label>Subject / Course Name</label>
                <input type="text" id="noteTitle" class="input-field" placeholder="e.g. Data Structures & Algorithms">
            </div>
            <div class="input-group">
                <label>Semester / Category</label>
                <input type="text" id="noteCat" class="input-field" placeholder="e.g. 1st Semester CSE">
            </div>
            <button class="btn" onclick="addNote()">Upload Note</button>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 1rem; font-family: 'Rajdhani', sans-serif; font-size: 1.3rem;">Available Notes Library</h3>
            <div class="notes-list" id="notesContainer">
                <!-- Dynamic notes load here -->
            </div>
        </div>

        <a href="index.html" class="back-link">← Return to Main Portfolio</a>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('collegeNotes')) || [
            { title: 'Computer Programming in C - Notes', cat: '1st Sem CSE' },
            { title: 'Applied Mathematics - 1 Formula Book', cat: '1st Sem All' }
        ];

                function renderNotes() {
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';
            notes.forEach((note, index) => {
                container.innerHTML += `
                    <div class="note-item">
                        <div>
                            <div class="note-title">${note.title}</div>
                            <div class="note-sub">${note.cat}</div>
                        </div>
                        <!-- yahan humne real file path aur download attribute jod diya hai -->
                        <a href="sample.pdf" download class="download-btn">📥 Download</a>
                    </div>
                `;
            });
        }

        function addNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const cat = document.getElementById('noteCat').value.trim();
            if (!title || !cat) {
                alert('Please fill in all fields.');
                return;
            }
            notes.push({ title, cat });
            localStorage.setItem('collegeNotes', JSON.stringify(notes));
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteCat').value = '';
            renderNotes();
        }

        renderNotes();
    </script>
</body>
</html>
