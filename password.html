<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | Designed by Priytam</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --inner-bg: #f1f5f9;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #0284c7;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .dark-mode {
            --bg-color: #030712;
            --card-bg: #0f172a;
            --inner-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
        .pass-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: var(--shadow); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
        h1 { font-size: 1.4rem; color: var(--accent-color); font-weight: 700; }
        .theme-toggle { background: var(--inner-bg); border: 1px solid var(--border-color); color: var(--accent-color); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        
        .result-box { display: flex; background: var(--inner-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.8rem 1rem; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        #passwordDisplay { font-family: monospace; font-size: 1.1rem; color: var(--text-color); word-break: break-all; outline: none; border: none; background: transparent; width: 100%; }
        .btn-copy { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.2rem; }

        .settings { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; color: var(--text-muted); font-weight: 500; }
        input[type="range"] { accent-color: var(--accent-color); cursor: pointer; width: 50%; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; }

        .btn-generate { width: 100%; padding: 0.8rem; background: var(--accent-color); color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-bottom: 1rem; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); }
        .btn-generate:hover { opacity: 0.9; transform: translateY(-2px); }

        .toast { text-align: center; font-size: 0.85rem; color: #22c55e; font-weight: 600; opacity: 0; transition: opacity 0.3s; margin-bottom: 1rem; }
        .back-link { display: block; text-align: center; color: var(--accent-color); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .branding { margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="pass-container">
        <div class="top-bar">
            <h1>🔐 Pass Generator</h1>
            <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
        </div>
        <p class="subtitle">Create strong & secure passwords instantly</p>

        <div class="result-box">
            <input type="text" id="passwordDisplay" readonly placeholder="P@ssw0rd123">
            <button class="btn-copy" onclick="copyPassword()" title="Copy Password">📋</button>
        </div>

        <div class="settings">
            <div class="setting-row">
                <span>Password Length: <span id="lengthVal">12</span></span>
                <input type="range" id="lengthRange" min="6" max="30" value="12" oninput="updateLength()">
            </div>
            <div class="setting-row">
                <span>Include Uppercase (A-Z)</span>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="setting-row">
                <span>Include Lowercase (a-z)</span>
                <input type="checkbox" id="lowercase" checked>
            </div>
            <div class="setting-row">
                <span>Include Numbers (0-9)</span>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="setting-row">
                <span>Include Symbols (@#$%)</span>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>

        <button class="btn-generate" onclick="generatePassword()">Generate Password ⚡</button>
        <div class="toast" id="toastMsg">Password Copied to Clipboard! ✨</div>
        <a href="index.html" class="back-link">← Back to Portfolio</a>
        <div class="branding">Designed by Priytam</div>
    </div>

    <script>
        const passwordDisplay = document.getElementById('passwordDisplay');
        const lengthRange = document.getElementById('lengthRange');
        const lengthVal = document.getElementById('lengthVal');
        const uppercase = document.getElementById('uppercase');
        const lowercase = document.getElementById('lowercase');
        const numbers = document.getElementById('numbers');
        const symbols = document.getElementById('symbols');
        const toastMsg = document.getElementById('toastMsg');

        const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowerChars = "abcdefghijklmnopqrstuvwxyz";
        const numberChars = "0123456789";
        const symbolChars = "@#$%^&*()_+~`|}{[]:;?><,./-=";

        function updateLength() {
            lengthVal.innerText = lengthRange.value;
            generatePassword();
        }

        function generatePassword() {
            let chars = "";
            if (uppercase.checked) chars += upperChars;
            if (lowercase.checked) chars += lowerChars;
            if (numbers.checked) chars += numberChars;
            if (symbols.checked) chars += symbolChars;

            if (chars === "") {
                passwordDisplay.value = "Select at least one option!";
                return;
            }

            let password = "";
            for (let i = 0; i < lengthRange.value; i++) {
                let randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }
            passwordDisplay.value = password;
        }

        function copyPassword() {
            if(!passwordDisplay.value || passwordDisplay.value.startsWith("Select")) return;
            navigator.clipboard.writeText(passwordDisplay.value);
            toastMsg.style.opacity = '1';
            setTimeout(() => {
                toastMsg.style.opacity = '0';
            }, 2000);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        window.onload = function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
            generatePassword();
        }
    </script>
</body>
</html>
