<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed & Accuracy Test | Priytam.dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --accent-cyan: #00e5ff;
            --accent-green: #00ff66;
            --accent-pink: #ff0055;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-cyan: rgba(0, 229, 255, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.3s; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; display: flex; flex-direction: column; justify-content: space-between; }

        .container { max-width: 800px; margin: 0 auto; width: 100%; }

        header { text-align: center; margin-bottom: 2.5rem; }
        header h1 { font-family: 'Rajdhani', sans-serif; font-size: 2.5rem; color: #fff; margin-bottom: 0.3rem; }
        header h1 span { color: var(--accent-cyan); }
        header p { color: var(--text-muted); font-size: 0.95rem; }

        .test-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* Stats Bar */
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .stat-box { background: rgba(7, 9, 14, 0.6); border: 1px solid var(--border-color); padding: 1rem; border-radius: 10px; text-align: center; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-value { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--accent-cyan); }

        /* Sentence Display Box */
        .text-display-box { background: #07090e; border: 1px solid var(--border-color); border-radius: 10px; padding: 1.5rem; font-size: 1.25rem; line-height: 1.8; margin-bottom: 1.5rem; min-height: 130px; letter-spacing: 0.5px; user-select: none; word-break: break-word; }
        
        .char { color: var(--text-muted); }
        .char.correct { color: var(--accent-green); text-shadow: 0 0 8px rgba(0,255,102,0.3); }
        .char.incorrect { color: var(--accent-pink); background: rgba(255,0,85,0.15); text-shadow: 0 0 8px rgba(255,0,85,0.3); border-radius: 2px; }
        .char.active { border-left: 2px solid var(--accent-cyan); animation: blinkCursor 1s infinite; }

        @keyframes blinkCursor { 0%, 100% { border-color: transparent; } 50% { border-color: var(--accent-cyan); } }

        /* Hidden Input to capture typing */
        .input-field { width: 100%; padding: 1rem; background: #07090e; border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 1rem; outline: none; margin-bottom: 1.5rem; }
        .input-field:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px var(--glow-cyan); }

        /* Controls */
        .controls { display: flex; justify-content: center; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; transition: 0.2s; }
        .btn-restart { background: var(--accent-cyan); color: #000; box-shadow: 0 0 15px var(--glow-cyan); }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Result Popup Overlay */
        .result-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 9, 14, 0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 100; }
        .result-modal { background: #111827; border: 1px solid var(--accent-cyan); padding: 2.5rem; border-radius: 16px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 0 30px var(--glow-cyan); }
        .result-modal h2 { font-family: 'Rajdhani', sans-serif; font-size: 2rem; color: #fff; margin-bottom: 1rem; }
        .result-stats { margin: 1.5rem 0; font-size: 1.1rem; color: var(--text-muted); line-height: 1.8; }
        .result-stats span { color: var(--accent-cyan); font-weight: 700; font-size: 1.3rem; }

        .back-link { display: block; text-align: center; margin-top: 2rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: var(--accent-cyan); }

        @media(max-width: 600px) {
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .text-display-box { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Typing Speed <span>& Accuracy Test</span></h1>
            <p>Test your keyboard speed and programming typing skills in real-time</p>
        </header>

        <div class="test-card">
            <div class="stats-bar">
                <div class="stat-box">
                    <div class="stat-label">Time Left</div>
                    <div class="stat-value" id="timer">60s</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">WPM</div>
                    <div class="stat-value" id="wpm">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-value" id="accuracy">100%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Errors</div>
                    <div class="stat-value" id="errors" style="color: var(--accent-pink);">0</div>
                </div>
            </div>

            <!-- Text Display Box -->
            <div class="text-display-box" id="textDisplay" onclick="focusInput()"></div>

            <!-- Hidden/Active Typing Input -->
            <input type="text" class="input-field" id="inputField" placeholder="Click here or on the text above to start typing..." autocomplete="off" autocapitalize="off" spellcheck="false">

            <div class="controls">
                <button class="btn btn-restart" onclick="resetTest()">🔄 Restart Test</button>
            </div>
        </div>

        <a href="index.html" class="back-link">← Return to Main Portfolio</a>
    </div>

    <!-- Result Modal -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-modal">
            <h2>🎉 Test Completed!</h2>
            <div class="result-stats">
                Your Speed: <span id="finalWpm">0</span> WPM<br>
                Accuracy: <span id="finalAccuracy">0</span>%<br>
                Total Errors: <span id="finalErrors">0</span>
            </div>
            <button class="btn btn-restart" onclick="closeModalAndReset()">Try Again</button>
        </div>
    </div>

    <script>
        const paragraphs = [
            "Programming is the art of algorithm design and the craft of debugging persistent software errors efficiently under strict deadlines.",
            "Web development requires a solid foundation in HTML, CSS, and JavaScript to build responsive, interactive user experiences.",
            "Government Polytechnic Dumka computer science students explore modern web technologies and digital content creation workflows daily.",
            "Cyberpunk aesthetics involve high contrast typography, glowing neon accents, glassmorphism UI, and dark mode optimization.",
            "Consistent practice, logical problem solving, and building real-world projects are essential milestones for becoming a professional software engineer."
        ];

        let timeLeft = 60;
        let timer = null;
        let isStarted = false;
        let charIndex = 0;
        let mistakes = 0;
        let totalTyped = 0;

        const textDisplay = document.getElementById('textDisplay');
        const inputField = document.getElementById('inputField');
        const timerDisplay = document.getElementById('timer');
        const wpmDisplay = document.getElementById('wpm');
        const accuracyDisplay = document.getElementById('accuracy');
        const errorsDisplay = document.getElementById('errors');
        
        const resultOverlay = document.getElementById('resultOverlay');
        const finalWpm = document.getElementById('finalWpm');
        const finalAccuracy = document.getElementById('finalAccuracy');
        const finalErrors = document.getElementById('finalErrors');

        function loadParagraph() {
            const randomIndex = Math.floor(Math.random() * paragraphs.length);
            const currentPara = paragraphs[randomIndex];
            textDisplay.innerHTML = '';
            
            currentPara.split('').forEach((char, index) => {
                const span = document.createElement('span');
                span.innerText = char;
                span.classList.add('char');
                if (index === 0) span.classList.add('active');
                textDisplay.appendChild(span);
            });
            inputField.value = '';
            charIndex = 0;
            mistakes = 0;
            totalTyped = 0;
            updateStats();
        }

        function focusInput() {
            inputField.focus();
        }

        inputField.addEventListener('input', () => {
            const characters = textDisplay.querySelectorAll('.char');
            const typedValue = inputField.value;
            const currentChar = typedValue[typedValue.length - 1];

            if (!isStarted) {
                isStarted = true;
                startTimer();
            }

            // Handle backspace or clearing
            if (typedValue.length < charIndex) {
                charIndex = typedValue.length;
                characters.forEach((char, idx) => {
                    char.classList.remove('correct', 'incorrect', 'active');
                    if (idx < charIndex) {
                        // re-evaluate past chars
                        // simplified handling for backspace
                    }
                });
                if (characters[charIndex]) characters[charIndex].classList.add('active');
                return;
            }

            if (charIndex < characters.length) {
                totalTyped++;
                if (characters[charIndex].innerText === currentChar) {
                    characters[charIndex].classList.add('correct');
                } else {
                    mistakes++;
                    characters[charIndex].classList.add('incorrect');
                }
                characters[charIndex].classList.remove('active');
                charIndex++;

                if (charIndex < characters.length) {
                    characters[charIndex].classList.add('active');
                } else {
                    // Paragraph finished before time, load new one or end
                    endTest();
                }
            }

            updateStats();
        });

        function startTimer() {
            timer = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    timerDisplay.innerText = timeLeft + 's';
                    calculateWPM();
                } else {
                    endTest();
                }
            }, 1000);
        }

        function calculateWPM() {
            const elapsedMinutes = (60 - timeLeft) / 60;
            if (elapsedMinutes > 0) {
                const correctChars = charIndex - mistakes;
                const wpm = Math.round((correctChars / 5) / elapsedMinutes);
                wpmDisplay.innerText = wpm < 0 ? 0 : wpm;
            }
        }

        function updateStats() {
            errorsDisplay.innerText = mistakes;
            let accuracy = 100;
            if (totalTyped > 0) {
                accuracy = Math.round(((totalTyped - mistakes) / totalTyped) * 100);
            }
            accuracyDisplay.innerText = (accuracy < 0 ? 0 : accuracy) + '%';
        }

        function endTest() {
            clearInterval(timer);
            inputField.disabled = true;

            finalWpm.innerText = wpmDisplay.innerText;
            finalAccuracy.innerText = accuracyDisplay.innerText.replace('%', '');
            finalErrors.innerText = mistakes;
            resultOverlay.style.display = 'flex';
        }

        function resetTest() {
            clearInterval(timer);
            timeLeft = 60;
            timerDisplay.innerText = '60s';
            wpmDisplay.innerText = '0';
            accuracyDisplay.innerText = '100%';
            errorsDisplay.innerText = '0';
            isStarted = false;
            inputField.disabled = false;
            loadParagraph();
            inputField.focus();
        }

        function closeModalAndReset() {
            resultOverlay.style.display = 'none';
            resetTest();
        }

        // Initialize on load
        window.onload = () => {
            loadParagraph();
            inputField.focus();
        };
    </script>
</body>
</html>
