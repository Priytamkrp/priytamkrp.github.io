<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Pomodoro & Task Vault | Priytam.dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --accent-cyan: #00e5ff;
            --accent-green: #00ff66;
            --accent-pink: #ff0055;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-cyan: rgba(0, 229, 255, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.3s; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; }

        .container { max-width: 750px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-family: 'Rajdhani', sans-serif; font-size: 2.5rem; color: #fff; margin-bottom: 0.3rem; }
        header h1 span { color: var(--accent-cyan); }
        header p { color: var(--text-muted); font-size: 0.95rem; }

        .app-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }

        .vault-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.8rem; backdrop-filter: blur(10px); position: relative; }
        h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; color: #fff; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }

        /* Pomodoro Styling */
        .timer-display { font-family: 'Rajdhani', sans-serif; font-size: 4rem; font-weight: 700; color: var(--accent-cyan); text-align: center; text-shadow: 0 0 20px var(--glow-cyan); margin: 0.5rem 0; }
        .timer-modes { display: flex; justify-content: center; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
        .mode-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .mode-btn.active { background: rgba(0, 229, 255, 0.15); color: var(--accent-cyan); border-color: var(--accent-cyan); }

        .custom-time-box { display: flex; gap: 8px; margin-bottom: 1.2rem; align-items: center; justify-content: center; }
        .custom-time-box input { width: 75px; padding: 6px 8px; background: #07090e; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; text-align: center; font-size: 0.9rem; outline: none; }
        .custom-time-box input:focus { border-color: var(--accent-cyan); }
        .custom-time-box span { font-size: 0.85rem; color: var(--text-muted); }
        .btn-set { background: var(--accent-cyan); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

        .timer-controls { display: flex; justify-content: center; gap: 10px; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none; transition: 0.2s; }
        .btn-start { background: var(--accent-cyan); color: #000; box-shadow: 0 0 15px var(--glow-cyan); }
        .btn-pause { background: var(--accent-pink); color: #fff; }
        .btn-reset { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Stop Alarm Button Style */
        .btn-stop-alarm { display: none; width: 100%; background: var(--accent-pink); color: #fff; padding: 0.8rem; border-radius: 8px; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; margin-top: 1rem; box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); animation: pulseBtn 1s infinite; }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* Alarm Flash Animation */
        @keyframes alarmFlash {
            0% { background-color: rgba(18, 24, 38, 0.85); border-color: var(--border-color); }
            50% { background-color: rgba(255, 0, 85, 0.35); border-color: var(--accent-pink); }
            100% { background-color: rgba(18, 24, 38, 0.85); border-color: var(--border-color); }
        }
        .alarm-active { animation: alarmFlash 0.8s infinite; }

        /* Task Vault Styling */
        .task-input-group { display: flex; gap: 8px; margin-bottom: 1.2rem; }
        input[type="text"] { flex: 1; background: #07090e; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: #fff; outline: none; font-size: 0.95rem; }
        input[type="text"]:focus { border-color: var(--accent-cyan); }
        .btn-add { background: var(--accent-cyan); color: #000; border: none; padding: 0 1rem; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .task-list { list-style: none; max-height: 250px; overflow-y: auto; }
        .task-item { display: flex; align-items: center; justify-content: space-between; background: rgba(7, 9, 14, 0.6); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.95rem; }
        .task-item.completed span { text-decoration: line-through; color: var(--text-muted); }
        .task-actions { display: flex; gap: 8px; }
        .task-btn { background: transparent; border: none; cursor: pointer; font-size: 1rem; }

        .back-link { display: block; text-align: center; margin-top: 2rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Focus <span>Pomodoro & Task Vault</span></h1>
            <p>High-Volume Alarm & Task Management System</p>
        </header>

        <div class="app-grid">
            
            <!-- Pomodoro Timer Box -->
            <div class="vault-card" id="timerCard">
                <h2>⏱️ Focus Timer</h2>
                <div class="timer-modes">
                    <button class="mode-btn active" onclick="setPreset(25, 0, this)">25m</button>
                    <button class="mode-btn" onclick="setPreset(15, 0, this)">15m</button>
                    <button class="mode-btn" onclick="setPreset(5, 0, this)">5m</button>
                    <button class="mode-btn" onclick="setPreset(0, 10, this)">10s (Test)</button>
                </div>

                <div class="custom-time-box">
                    <input type="number" id="customMins" placeholder="Min" min="0" max="120">
                    <span>m</span>
                    <input type="number" id="customSecs" placeholder="Sec" min="0" max="59">
                    <span>s</span>
                    <button class="btn-set" onclick="setCustomTimer()">Set</button>
                </div>

                <div class="timer-display" id="timer">25:00</div>

                <div class="timer-controls" id="timerControls">
                    <button class="btn btn-start" onclick="startTimer()">Start</button>
                    <button class="btn btn-pause" onclick="pauseTimer()">Pause</button>
                    <button class="btn btn-reset" onclick="resetTimer()">Reset</button>
                </div>

                <!-- Stop Alarm Button -->
                <button class="btn-stop-alarm" id="stopAlarmBtn" onclick="stopAlarm()">🚨 STOP ALARM</button>
            </div>

            <!-- Task Vault Box -->
            <div class="vault-card">
                <h2>📋 Task Vault</h2>
                <div class="task-input-group">
                    <input type="text" id="taskInput" placeholder="Add a new task...">
                    <button class="btn-add" onclick="addTask()">Add</button>
                </div>

                <ul class="task-list" id="taskList"></ul>
            </div>

        </div>

        <a href="index.html" class="back-link">← Return to Main Portfolio</a>
    </div>

    <script>
        let audioCtx = null;
        let alarmInterval = null;

        // --- High Volume Dual-Tone Looping Alarm ---
        function playAlarmTone() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // Dual oscillators for a louder, sharper siren effect
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc1.type = 'square';
                osc2.type = 'sawtooth';

                // High frequencies for maximum alertness
                osc1.frequency.setValueAtTime(1046.50, audioCtx.currentTime); // C6 note
                osc2.frequency.setValueAtTime(1318.51, audioCtx.currentTime); // E6 note
                
                // Boosted volume level (Gain set higher for loudness)
                gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc1.start();
                osc2.start();
                osc1.stop(audioCtx.currentTime + 0.35);
                osc2.stop(audioCtx.currentTime + 0.35);
            } catch (e) {
                console.log("Audio Error:", e);
            }
        }

        function startAlarmLoop() {
            if (alarmInterval !== null) return;
            playAlarmTone();
            alarmInterval = setInterval(() => {
                playAlarmTone();
            }, 600); // Loops every 0.6 seconds continuously
        }

        function stopAlarm() {
            if (alarmInterval !== null) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            document.getElementById('timerCard').classList.remove('alarm-active');
            document.getElementById('stopAlarmBtn').style.display = 'none';
            document.getElementById('timerControls').style.display = 'flex';
            resetTimer();
        }

        let timeLeft = 25 * 60;
        let timerId = null;
        let totalDuration = 25 * 60;

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function setPreset(mins, secs, element) {
            pauseTimer();
            totalDuration = (mins * 60) + secs;
            timeLeft = totalDuration;
            updateDisplay();
            
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        function setCustomTimer() {
            const mins = parseInt(document.getElementById('customMins').value) || 0;
            const secs = parseInt(document.getElementById('customSecs').value) || 0;
            
            const calculatedTotal = (mins * 60) + secs;
            if (calculatedTotal <= 0) {
                alert("Please enter valid minutes or seconds!");
                return;
            }

            pauseTimer();
            totalDuration = calculatedTotal;
            timeLeft = totalDuration;
            updateDisplay();
            
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        }

        function startTimer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (timerId !== null) return;

            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    
                    startAlarmLoop();
                    document.getElementById('timerCard').classList.add('alarm-active');
                    document.getElementById('timerControls').style.display = 'none';
                    document.getElementById('stopAlarmBtn').style.display = 'block';
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = totalDuration;
            updateDisplay();
        }

        // --- Task Vault Logic ---
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;

            const li = document.createElement('li');
            li.className = 'task-item';
            li.innerHTML = `
                <span>${text}</span>
                <div class="task-actions">
                    <button class="task-btn" onclick="toggleTask(this)">✅</button>
                    <button class="task-btn" onclick="deleteTask(this)">❌</button>
                </div>
            `;
            taskList.appendChild(li);
            taskInput.value = '';
        }

        function toggleTask(btn) {
            btn.closest('.task-item').classList.toggle('completed');
        }

        function deleteTask(btn) {
            btn.closest('.task-item').remove();
        }

        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTask();
        });
    </script>
</body>
</html>
