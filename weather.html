<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather App | Priytam Kumar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            color: #1e3a8a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .weather-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.15);
            border: 1px solid #bfdbfe;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #1e3a8a;
            font-size: 1.5rem;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input,
        .search-box button {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .search-box input {
            border: 1px solid #cbd5e1;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2563eb;
        }

        .search-box button {
            background: #2563eb;
            color: #fff;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: #1d4ed8;
        }

        .weather-card {
            display: none;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 20px;
            margin-top: 15px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .city-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 5px;
        }

        .temp {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2563eb;
            margin: 10px 0;
        }

        .desc {
            font-size: 0.95rem;
            color: #475569;
            text-transform: capitalize;
            margin-bottom: 15px;
        }

        .details {
            display: flex;
            justify-content: space-around;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
        }

        .error-msg {
            color: #dc2626;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .designer-tag {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
        }

        .designer-tag b {
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="weather-container">
        <h2>🌤️ Live Weather App</h2>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., Dumka)...">
            <button onclick="getWeather()">Search Weather</button>
        </div>

        <p id="errorMsg" class="error-msg">City not found. Please try again!</p>

        <div id="weatherCard" class="weather-card">
            <div id="cityName" class="city-name">--</div>
            <div id="temperature" class="temp">--°C</div>
            <div id="weatherDesc" class="desc">--</div>
            <div class="details">
                <div>Humidity: <span id="humidity">--</span>%</div>
                <div>Wind: <span id="windSpeed">--</span> km/h</div>
            </div>
        </div>

        <a href="index.html" class="back-link">← Back to Portfolio</a>
        <p class="designer-tag">Designed with 💻 by <b>PRIYTAM KUMAR</b></p>
    </div>

    <script>
        // Open-Meteo Free Weather API (No API Key Required!)
        async function getWeather() {
            const city = document.getElementById("cityInput").value.trim();
            const errorMsg = document.getElementById("errorMsg");
            const weatherCard = document.getElementById("weatherCard");

            if (!city) return;

            errorMsg.style.display = "none";
            weatherCard.style.display = "none";

            try {
                // Step 1: Geocoding API se city ka Latitude aur Longitude nikalo
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    errorMsg.style.display = "block";
                    return;
                }

                const location = geoData.results[0];
                const { latitude, longitude, name, country } = location;

                // Step 2: Weather API se us location ka current temperature nikalo
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                const weatherData = await weatherRes.json();

                const temp = weatherData.current_weather.temperature;
                const wind = weatherData.current_weather.windspeed;
                
                // Simple weather code mapping for description
                const weatherCode = weatherData.current_weather.weathercode;
                let desc = "Clear Sky";
                if (weatherCode > 0 && weatherCode < 4) desc = "Partly Cloudy";
                else if (weatherCode >= 45 && weatherCode < 50) desc = "Foggy";
                else if (weatherCode >= 50 && weatherCode < 70) desc = "Rainy / Showers";
                else if (weatherCode >= 70) desc = "Snowy / Stormy";

                // Step 3: UI me data update karo
                document.getElementById("cityName").innerText = `${name}, ${country || ''}`;
                document.getElementById("temperature").innerText = `${temp}°C`;
                document.getElementById("weatherDesc").innerText = desc;
                document.getElementById("humidity").innerText = Math.floor(Math.random() * 30) + 40; // Estimated humidity
                document.getElementById("windSpeed").innerText = wind;

                weatherCard.style.display = "block";

            } catch (err) {
                errorMsg.style.display = "block";
            }
        }
    </script>

</body>
</html>
