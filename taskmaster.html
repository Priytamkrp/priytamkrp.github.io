<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Assignment Planner | Priytam.dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --accent-cyan: #00e5ff;
            --accent-pink: #ff0055;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-cyan: rgba(0, 229, 255, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; display: flex; flex-direction: column; justify-content: space-between; }
        .container { max-width: 800px; margin: 0 auto; width: 100%; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-family: 'Rajdhani', sans-serif; font-size: 2.3rem; color: #fff; margin-bottom: 0.3rem; }
        header h1 span { color: var(--accent-cyan); }
        header p { color: var(--text-muted); font-size: 0.9rem; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.5rem; backdrop-filter: blur(10px); margin-bottom: 1.5rem; }
        .row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 1rem; align-items: end; }
        .input-group { margin-bottom: 0; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .input-field { width: 100%; padding: 0.8rem 1rem; background: #07090e; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        .input-field:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px var(--glow-cyan); }
        
        .btn { padding: 0.8rem 1.5rem; background: var(--accent-cyan); color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; box-shadow: 0 0 15px var(--glow-cyan); height: 43px; }
        .btn:hover { opacity: 0.9; }

        .task-list { display: grid; gap: 0.8rem; margin-top: 1.5rem; }
        .task-item { background: #07090e; border: 1px solid var(--border-color); padding: 1rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-item.completed { opacity: 0.6; text-decoration: line-through; }
        .task-actions { display: flex; gap: 0.5rem; }
        .action-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .action-btn:hover { border-color: var(--accent-cyan); color: #fff; }
        .delete-btn:hover { border-color: var(--accent-pink); color: var(--accent-pink); }
        .back-link { display: block; text-align: center; margin-top: 2rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: var(--accent-cyan); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>TaskMaster <span>Assignment Planner</span></h1>
            <p>Manage your college projects, lab tasks, and daily assignments</p>
        </header>

        <div class="card">
            <div class="row">
                <div class="input-group">
                    <label>Task / Assignment Description</label>
                    <input type="text" id="taskInput" class="input-field" placeholder="e.g. Submit Web Dev lab report">
                </div>
                <div class="input-group">
                    <label>Deadline</label>
                    <input type="date" id="taskDate" class="input-field">
                </div>
                <button class="btn" onclick="addTask()">Add Task</button>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 1rem; font-family: 'Rajdhani', sans-serif; font-size: 1.3rem;">Your Pending Tasks</h3>
            <div class="task-list" id="taskContainer">
                <!-- Tasks load here -->
            </div>
        </div>

        <a href="index.html" class="back-link">← Return to Main Portfolio</a>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('taskMasterList')) || [
            { text: 'Complete HTML Portfolio Navbar', date: '2026-06-10', completed: false }
        ];

        function renderTasks() {
            const container = document.getElementById('taskContainer');
            container.innerHTML = '';
            if(tasks.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">No tasks pending. Great job!</p>';
                return;
            }
            tasks.forEach((task, index) => {
                container.innerHTML += `
                    <div class="task-item ${task.completed ? 'completed' : ''}">
                        <div>
                            <div style="font-weight: 600; color: #fff;">${task.text}</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Due: ${task.date || 'No deadline'}</div>
                        </div>
                        <div class="task-actions">
                            <button class="action-btn" onclick="toggleTask(${index})">${task.completed ? 'Undo' : 'Complete'}</button>
                            <button class="action-btn delete-btn" onclick="deleteTask(${index})">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function addTask() {
            const text = document.getElementById('taskInput').value.trim();
            const date = document.getElementById('taskDate').value;
            if (!text) {
                alert('Please enter a task description.');
                return;
            }
            tasks.push({ text, date, completed: false });
            localStorage.setItem('taskMasterList', JSON.stringify(tasks));
            document.getElementById('taskInput').value = '';
            document.getElementById('taskDate').value = '';
            renderTasks();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            localStorage.setItem('taskMasterList', JSON.stringify(tasks));
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            localStorage.setItem('taskMasterList', JSON.stringify(tasks));
            renderTasks();
        }

        renderTasks();
    </script>
</body>
</html>
