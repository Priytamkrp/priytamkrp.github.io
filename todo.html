<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Priytam Kumar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .todo-container {
            background: #111827;
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
        }
        .title {
            font-size: 1.2rem;
            color: #38bdf8;
            margin-bottom: 0.3rem;
            font-weight: 600;
            text-align: center;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        input {
            flex: 1;
            padding: 0.7rem 1rem;
            background: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .btn-add {
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 0 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add:hover {
            opacity: 0.9;
        }
        ul {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 1.5rem;
        }
        li {
            background: #0b0f19;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            border: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
        }
        li.completed span {
            text-decoration: line-through;
            color: #64748b;
        }
        .task-actions {
            display: flex;
            gap: 0.5rem;
        }
        .btn-action {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .back-link {
            display: block;
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <div class="title">📝 Task Manager</div>
        <div class="subtitle">Designed by Priytam</div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button class="btn-add" onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>

        <a href="index.html" class="back-link">← Back to Portfolio</a>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText === "") return;

            const li = document.createElement('li');
            li.innerHTML = `
                <span onclick="toggleTask(this)">${taskText}</span>
                <div class="task-actions">
                    <button class="btn-action" onclick="deleteTask(this)">❌</button>
                </div>
            `;
            taskList.appendChild(li);
            taskInput.value = "";
        }

        function toggleTask(element) {
            element.parentElement.classList.toggle('completed');
        }

        function deleteTask(element) {
            element.parentElement.parentElement.remove();
        }

        // Allow pressing Enter key to add task
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });
    </script>

</body>
</html>
