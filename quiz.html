<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Quiz App | Designed by Priytam</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1f2937;
            --accent-color: #38bdf8;
            --correct-color: #22c55e;
            --wrong-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .quiz-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .question-box h2 {
            font-size: 1.1rem;
            margin-bottom: 1.2rem;
            font-weight: 600;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .option-btn {
            background: #1f2937;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--accent-color);
            background: #374151;
        }

        .option-btn.correct {
            background: var(--correct-color) !important;
            color: #fff;
            border-color: var(--correct-color);
        }

        .option-btn.wrong {
            background: var(--wrong-color) !important;
            color: #fff;
            border-color: var(--wrong-color);
        }

        .footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .next-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        .result-box {
            text-align: center;
            display: none;
        }

        .result-box h2 {
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        .result-box p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .restart-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .branding {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="header">
            <h1>🧠 CS Mini Quiz</h1>
            <p>Test your Computer Science Knowledge</p>
        </div>

        <div id="quiz-box">
            <div class="question-box">
                <h2 id="question">Question text goes here...</h2>
            </div>
            <div class="options-grid" id="options">
                <!-- Options will be generated by JS -->
            </div>
            <div class="footer">
                <span id="progress" style="color: var(--text-muted); font-size: 0.85rem;">Question 1 of 6</span>
                <button id="next-btn" class="next-btn" onclick="nextQuestion()">Next Question ➔</button>
            </div>
        </div>

        <div id="result-box" class="result-box">
            <h2>🎉 Quiz Completed!</h2>
            <p id="score-text">You scored 0 out of 6</p>
            <button class="restart-btn" onclick="restartQuiz()">Try Again 🔄</button>
        </div>

        <div class="branding">Designed by Priytam</div>
    </div>

    <script>
        const allQuestions = [
            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "High Tech Modern Language",
                    "Hyperlink and Text Management Language",
                    "Home Tool Markup Language"
                ],
                answer: 0
            },
            {
                question: "Which language is used for styling web pages?",
                options: ["HTML", "JQuery", "CSS", "XML"],
                answer: 2
            },
            {
                question: "What is the correct extension of a JavaScript file?",
                options: [".javascript", ".js", ".script", ".java"],
                answer: 1
            },
            {
                question: "Which symbol is used for Single Line Comments in C and JavaScript?",
                options: ["<!-- -->", "/* */", "#", "//"],
                answer: 3
            },
            {
                question: "Which of the following is not a programming language?",
                options: ["Python", "HTML", "C++", "Java"],
                answer: 1
            },
            {
                question: "Inside which HTML element do we put the JavaScript?",
                options: ["<js>", "<script>", "<javascript>", "<code>"],
                answer: 1
            }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const progressElement = document.getElementById("progress");
        const nextButton = document.getElementById("next-btn");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const scoreText = document.getElementById("score-text");

        function startQuiz() {
            questions = [...allQuestions].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;
            quizBox.style.display = "block";
            resultBox.style.display = "none";
            showQuestion();
        }

        function showQuestion() {
            resetState();
            let currentQuestion = questions[currentQuestionIndex];
            
            // Automatically add sequential numbering (1, 2, 3...) based on current display order
            questionElement.innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
            progressElement.innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => selectAnswer(button, index);
                optionsElement.appendChild(button);
            });
        }

        function resetState() {
            nextButton.style.display = "none";
            optionsElement.innerHTML = "";
        }

        function selectAnswer(selectedBtn, index) {
            let correctIndex = questions[currentQuestionIndex].answer;
            let buttons = optionsElement.querySelectorAll(".option-btn");

            buttons.forEach(btn => btn.disabled = true);

            if (index === correctIndex) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                buttons[correctIndex].classList.add("correct");
            }

            nextButton.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizBox.style.display = "none";
            resultBox.style.display = "block";
            scoreText.innerText = `You scored ${score} out of ${questions.length}!`;
        }

        function restartQuiz() {
            startQuiz();
        }

        startQuiz();
    </script>
</body>
</html>
