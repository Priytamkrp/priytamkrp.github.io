<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator | Priytam Kumar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .calculator {
            background: #111827;
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 340px;
        }
        .calculator-title {
            text-align: center;
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 0.2rem;
            font-weight: 600;
        }
        .calculator-subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 1rem;
        }
        #display {
            width: 100%;
            height: 65px;
            background: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 10px;
            color: #fff;
            font-size: 1.8rem;
            text-align: right;
            padding: 0 1rem;
            margin-bottom: 1.2rem;
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.7rem;
        }
        button {
            padding: 0.9rem 0;
            font-size: 1.1rem;
            font-weight: 600;
            background: #1f2937;
            color: #f8fafc;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #374151;
        }
        .btn-operator {
            background: #0284c7;
            color: #fff;
        }
        .btn-operator:hover {
            opacity: 0.9;
        }
        .btn-equal {
            background: #38bdf8;
            color: #0b0f19;
        }
        .btn-equal:hover {
            background: #0284c7;
            color: #fff;
        }
        .btn-clear {
            background: #ef4444;
            color: #fff;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="calculator-title">✨ Smart Calculator</div>
        <div class="calculator-subtitle">Designed by Priytam</div>
        <input type="text" id="display" disabled>
        
        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('(')" class="btn-operator">(</button>
            <button onclick="appendValue(')')" class="btn-operator">)</button>
            <button onclick="appendValue('/')" class="btn-operator">/</button>

            <!-- Row 2 -->
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')" class="btn-operator">*</button>

            <!-- Row 3 -->
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')" class="btn-operator">-</button>

            <!-- Row 4 -->
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')" class="btn-operator">+</button>

            <!-- Row 5 -->
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="backspace()">⌫</button>
            <button onclick="calculate()" class="btn-equal">=</button>
        </div>

        <a href="index.html" class="back-link">← Back to Portfolio</a>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendValue(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = '';
        }

        function backspace() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>

</body>
</html>
