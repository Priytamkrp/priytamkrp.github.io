<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Currency Converter | Designed by Priytam</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --inner-bg: #f1f5f9;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #0284c7;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .dark-mode {
            --bg-color: #030712;
            --card-bg: #0f172a;
            --inner-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
        .currency-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: var(--shadow); text-align: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
        h1 { font-size: 1.4rem; color: var(--accent-color); font-weight: 700; }
        .theme-toggle { background: var(--inner-bg); border: 1px solid var(--border-color); color: var(--accent-color); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        
        .input-group { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; text-align: left; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        input, select { width: 100%; padding: 0.8rem 1rem; background: var(--inner-bg); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-color); font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: var(--accent-color); }

        .row { display: flex; gap: 10px; }
        .col { flex: 1; }

        .btn-convert { width: 100%; padding: 0.8rem; background: var(--accent-color); color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-bottom: 1.5rem; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); }
        .btn-convert:hover { opacity: 0.9; transform: translateY(-2px); }

        .result-box { background: var(--inner-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.5rem; font-size: 1.1rem; font-weight: 600; color: var(--accent-color); display: none; }
        
        .back-link { display: block; text-align: center; color: var(--accent-color); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .branding { margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="currency-container">
        <div class="top-bar">
            <h1>💱 Live Currency</h1>
            <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
        </div>
        <p class="subtitle">Real-time global currency converter API</p>

        <div class="input-group">
            <label>Amount</label>
            <input type="number" id="amount" value="1" min="0.01" step="any">
        </div>

        <div class="row input-group">
            <div class="col">
                <label>From</label>
                <select id="fromCurrency">
                    <option value="USD">🇺🇸 USD - United States</option>
                    <option value="INR" selected>🇮🇳 INR - India</option>
                    <option value="EUR">🇪🇺 EUR - European Union</option>
                    <option value="GBP">🇬🇧 GBP - United Kingdom</option>
                    <option value="CAD">🇨🇦 CAD - Canada</option>
                    <option value="AUD">🇦🇺 AUD - Australia</option>
                    <option value="JPY">🇯🇵 JPY - Japan</option>
                </select>
            </div>
            <div class="col">
                <label>To</label>
                <select id="toCurrency">
                    <option value="USD" selected>🇺🇸 USD - United States</option>
                    <option value="INR">🇮🇳 INR - India</option>
                    <option value="EUR">🇪🇺 EUR - European Union</option>
                    <option value="GBP">🇬🇧 GBP - United Kingdom</option>
                    <option value="CAD">🇨🇦 CAD - Canada</option>
                    <option value="AUD">🇦🇺 AUD - Australia</option>
                    <option value="JPY">🇯🇵 JPY - Japan</option>
                </select>
            </div>
        </div>

        <button class="btn-convert" onclick="convertCurrency()">Fetch Live Rates 🚀</button>

        <div class="result-box" id="resultBox"></div>

        <a href="index.html" class="back-link">← Back to Portfolio</a>
        <div class="branding">Designed by Priytam</div>
    </div>

    <script>
        async function convertCurrency() {
            const amount = parseFloat(document.getElementById('amount').value);
            const from = document.getElementById('fromCurrency').value;
            const to = document.getElementById('toCurrency').value;
            const resultBox = document.getElementById('resultBox');

            if (isNaN(amount) || amount <= 0) {
                resultBox.style.display = "block";
                resultBox.innerText = "Please enter a valid amount!";
                return;
            }

            resultBox.style.display = "block";
            resultBox.innerText = "Fetching live rates...";

            try {
                const response = await fetch(`https://open.er-api.com/v6/latest/${from}`);
                const data = await response.json();

                if (data && data.rates && data.rates[to]) {
                    const rate = data.rates[to];
                    const convertedAmount = amount * rate;
                    resultBox.innerHTML = `${amount} ${from} = <br><span style="font-size: 1.3rem;">${convertedAmount.toFixed(2)} ${to}</span>`;
                } else {
                    resultBox.innerText = "Error fetching rates. Try again!";
                }
            } catch (error) {
                resultBox.innerText = "Network error! Check your connection.";
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        window.onload = function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
            convertCurrency();
        }
    </script>
</body>
</html>
